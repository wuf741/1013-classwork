<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Classwork2</title>

    <style>
        #building{
        position:absolute;
        width: 500px;
        height: 600px;
        background-color:#e0dbd0;
        border: 1px solid black;
        overflow:hidden }

        .window{
       width: 30px;
        height: 30px;

        background-color: #9cadf2;
        margin: 10px;
        border: 3px solid #75b1ff;
        box-shadow: inset 4px 4px 8px #3d5471; }

        #window1{
        position: absolute;
        top: 0px;
        left: 115px;
    height:50px;
width: 40px; }
    
    
    #window2{
        position: absolute;
        top: 0px;
        left: 10px;
    width:60px;
    height:60px; }
    
    #window3{
        position: absolute;
        top: 100px;
        left: 10px;
    width:60px;
    height:60px; }
        

    </style>
</head>
<body>
    <div id="building"> 
        <div id="window1" class="window"></div>
        <div id="window2"class="window"></div>
        <div id="window3"class="window"></div>
    </div>
</body>
</html>
